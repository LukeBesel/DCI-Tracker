<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
// footer install button: native prompt where supported, instructions elsewhere
(function () {
  const btn = document.getElementById("installBtn");
  let deferred = null;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!standalone) btn.hidden = false;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener("click", e => {
    e.preventDefault();
    if (deferred) { deferred.prompt(); deferred = null; return; }
    const ua = navigator.userAgent;
    const msg = /iPhone|iPad|iPod/.test(ua)
      ? "Install on iPhone/iPad:\n\n1. Tap the Share button (square with arrow)\n2. Scroll down and tap 'Add to Home Screen'\n3. Tap Add — DCI Tracker appears as an app"
      : /Android/.test(ua)
        ? "Install on Android:\n\n1. Tap the browser menu (three dots)\n2. Tap 'Add to Home screen' or 'Install app'\n3. Confirm — DCI Tracker appears as an app"
        : "Install on this computer:\n\nLook for the install icon at the right end of the address bar (Chrome/Edge), or use the browser menu and choose 'Install DCI Tracker'.";
    alert(msg);
  });
  addEventListener("appinstalled", () => { btn.hidden = true; });
})();
</script>
