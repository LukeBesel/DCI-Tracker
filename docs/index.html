<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCI Tracker — Scores, Rankings & History</title>
<meta name="description" content="Auto-updating DCI drum corps dashboard: current season rankings, multi-corps multi-year comparisons, every published score, caption recaps, corps histories and champions — straight from official DCI.org published scores.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eae0c8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DCI Tracker">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g stroke='%23191510' stroke-width='4' stroke-linecap='round'><line x1='17' y1='9' x2='42' y2='27'/><line x1='47' y1='9' x2='22' y2='27'/></g><circle cx='17' cy='9' r='4' fill='%23191510'/><circle cx='47' cy='9' r='4' fill='%23191510'/><rect x='8' y='28' width='48' height='26' rx='5' fill='%23e8590c'/><rect x='8' y='28' width='48' height='7' rx='3.5' fill='%23faf6ec'/><path d='M14 35 L22 54 M30 35 L38 54 M46 35 L54 54 M22 54 L30 35 M38 54 L46 35' stroke='%23f9f9f7' stroke-width='2.6' fill='none' stroke-linecap='round' opacity='0.85'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
      <g stroke="#191510" stroke-width="4" stroke-linecap="round">
        <line x1="17" y1="9" x2="42" y2="27"/><line x1="47" y1="9" x2="22" y2="27"/>
      </g>
      <circle cx="17" cy="9" r="4" fill="#191510"/><circle cx="47" cy="9" r="4" fill="#191510"/>
      <rect x="8" y="28" width="48" height="26" rx="5" fill="#e8590c"/>
      <rect x="8" y="28" width="48" height="7" rx="3.5" fill="#faf6ec"/>
      <path d="M14 35 L22 54 M30 35 L38 54 M46 35 L54 54 M22 54 L30 35 M38 54 L46 35" stroke="#f9f9f7" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85"/>
    </svg>
    <span>DCI <b>Tracker</b></span>
  </a>
  <nav id="nav">
    <a href="#/" data-route="rankings" title="Current standings — latest scores and movement">Rankings</a>
    <a href="#/corps" data-route="corps" title="Corps directory + compare any corps across any seasons">Corp Data</a>
    <a href="#/seasons" data-route="seasons" title="Every season, every event, full results and recaps">Season History</a>
    <a href="#/captions" data-route="captions" title="Judge-by-judge caption scores: GE, visual, brass, percussion leaders">Captions</a>
  </nav>
  <div class="updated" id="updated" title="Data refresh time"></div>
</header>

<main id="app" class="viz-root">
  <div class="loading">Loading…</div>
</main>

<footer class="foot">
  <div><a href="#/database"><b>Full score database</b> — every score, sortable &amp; exportable →</a></div>
  <div><button id="installBtn" class="tab" hidden>📲 Install app</button></div>
  <div>Scores from <a href="https://www.dci.org/scores" rel="noopener">DCI.org</a> · updates nightly at 10:30 PM ET</div>
</footer>

<div id="tooltip" class="tooltip" hidden></div>
<script src="charts.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
// footer install button: native prompt where supported, instructions elsewhere
(function () {
  const btn = document.getElementById("installBtn");
  let deferred = null;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!standalone) btn.hidden = false;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener("click", () => {
    if (deferred) { deferred.prompt(); deferred = null; }
    else alert("To install DCI Tracker:\n\niPhone/iPad: Share button \u2192 Add to Home Screen\nAndroid: browser menu \u2192 Add to Home screen / Install app\nDesktop Chrome/Edge: install icon in the address bar");
  });
  addEventListener("appinstalled", () => { btn.hidden = true; });
})();
</script>
</body>
</html>
