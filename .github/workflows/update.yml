name: Daily update

on:
  schedule:
    # 10:30 PM Eastern (02:30 UTC during EDT) — after evening shows post
    - cron: "30 2 * * *"
    # Morning sweep (~8 AM ET) to catch late West Coast results
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run update scrape
        run: bash scraper/run_all.sh update
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "Data update: $(date -u +'%F %H:%M') UTC"
          # rebase onto whatever landed while we scraped; data conflicts
          # resolve in favor of this run (fresher scrape), retry the push
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((5 * i))
          done
          echo "::error::could not push results after retries"
          exit 1

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
