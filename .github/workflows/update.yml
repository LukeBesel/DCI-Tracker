name: Data update

on:
  schedule:
    # every 15 minutes, year-round — GitHub's shared cron often fires late
    # or skips, so the tighter schedule keeps real gaps near half an hour
    # (the show-night watcher covers the minutes in between)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run update scrape
        # the ~09:00 UTC run each day also does the deep passes
        # (Wikipedia profiles + history archive chunks)
        run: |
          if [ "$(date -u +%H)" = "09" ]; then export RUN_HISTORY=1; fi
          bash scraper/run_all.sh update
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # 1) commit ONLY scrape inputs (data/). docs/data is a build product:
          #    it must never be merged — it is rebuilt from merged inputs below.
          git add -A data
          git diff --cached --quiet || git commit -m "Data update: $(date -u +'%F %H:%M') UTC (inputs)"
          # the scrape-time build left docs/data modified in the working tree;
          # drop those changes (docs/data regenerates from merged inputs below)
          git checkout -- . 2>/dev/null || true
          git clean -fd docs/data 2>/dev/null || true
          for i in 1 2 3 4; do
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort 2>/dev/null || true
              sleep $((5 * i))
              continue
            fi
            # 2) regenerate site data from the merged inputs, commit, push
            python scraper/build_data.py
            git add -A data docs/data
            git diff --cached --quiet || git commit -m "Data update: $(date -u +'%F %H:%M') UTC"
            git push && exit 0
            sleep $((5 * i))
          done
          echo "::error::could not push results after retries"
          exit 1
      - name: Save scrape output if push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-data-${{ github.run_id }}
          path: |
            data/parsed
            data/scrape_report.txt
          retention-days: 3
      - name: Keep the beat & wake the show-night watcher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/actions"
          hdr1="Authorization: Bearer $GH_TOKEN"
          hdr2="Accept: application/vnd.github+json"
          # self-perpetuating cadence: the pulse sleeps ~12 min, then
          # dispatches the next update (GitHub's cron is only the backstop)
          curl -sf -X POST -H "$hdr1" -H "$hdr2" \
            "$api/workflows/pulse.yml/dispatches" -d '{"ref":"main"}' || true
          # show window (23:00–09:59 UTC covers evening + West Coast): make
          # sure a live watcher shift is running — its own no-shows check
          # exits immediately on quiet days
          H=$(date -u +%H)
          if [ "$H" -ge 23 ] || [ "$H" -lt 10 ]; then
            active=0
            for st in in_progress queued; do
              n=$(curl -sf -H "$hdr1" -H "$hdr2" \
                "$api/workflows/watch.yml/runs?status=$st&per_page=1" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count',0))" || echo 1)
              active=$((active + n))
            done
            if [ "$active" = "0" ]; then
              echo "starting a watcher shift"
              curl -sf -X POST -H "$hdr1" -H "$hdr2" \
                "$api/workflows/watch.yml/dispatches" -d '{"ref":"main"}' || true
            fi
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
