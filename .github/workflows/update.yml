name: Daily update

on:
  schedule:
    # Twice daily: after US evening shows post (~07:30 UTC) and midday refresh
    - cron: "30 7 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run update scrape
        run: bash scraper/run_all.sh update
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git pull --rebase origin main || true
          git push
