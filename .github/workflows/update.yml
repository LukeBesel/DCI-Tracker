name: Daily update

on:
  schedule:
    # 10:30 PM Eastern (02:30 UTC during EDT) — after evening shows post
    - cron: "30 2 * * *"
    # Morning sweep (~8 AM ET) to catch late West Coast results
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run update scrape
        run: bash scraper/run_all.sh update
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Data update: $(date -u +'%F %H:%M') UTC"
          git pull --rebase origin main || true
          git push

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
