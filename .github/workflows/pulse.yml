name: Pulse
# GitHub's shared cron delivers */15 schedules roughly hourly at best, so
# the pipeline keeps its own beat: each data update dispatches a pulse, the
# pulse sleeps ~12 minutes and dispatches the next update. The cron here
# only restarts the chain if it ever breaks; the concurrency group folds
# duplicate pulses into one.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait, then trigger the next data update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 720
          # Dispatch the next update, but never fail the job over a transient
          # hiccup: GitHub occasionally rate-limits workflow_dispatch, and a
          # single missed tick is harmless — the */15 cron restarter and
          # update.yml's own re-arm keep the chain alive. Retry a few times,
          # then warn-and-exit-0 so the beat continues without a failure email.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "update dispatched (HTTP 204)"; exit 0
            fi
            echo "::warning::dispatch attempt $i got HTTP $code: $(head -c 300 /tmp/resp)"
            sleep $((10 * i))
          done
          echo "::warning::could not dispatch update after retries — cron/self-rearm backstop will recover"
          exit 0
