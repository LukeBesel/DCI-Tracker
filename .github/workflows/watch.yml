name: Show-night live watcher
# On summer show nights, poll the DCI scores index every ~3 minutes and
# publish the moment new scores appear — instead of waiting for the
# half-hourly cron. One long job per evening; exits early on no-show days.
on:
  schedule:
    # backup starts (the update pipeline auto-starts a shift whenever one
    # isn't running in the window, since GitHub's cron is unreliable). Each
    # shift watches for ~5 hours; back-to-back shifts cover noon ET → morning.
    - cron: "0 16 * 5-8 *"    # noon ET — afternoon / matinee shows
    - cron: "0 20 * 5-8 *"    # 4 PM ET — early-evening shows
    - cron: "20 23 * 5-8 *"   # 7:20 PM ET — main evening block
    - cron: "0 5 * 5-8 *"     # 1 AM ET — West Coast finishes
  workflow_dispatch:
# own lane, NOT the shared "scrape" group: this job holds its lock for a
# five-hour shift, and sharing it froze every 15-minute update run behind
# it all evening. Concurrent pushes are safe — both sides commit through
# the same pull-rebase-retry sequence.
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Watch for score drops
        run: |
          set -u
          # no shows today (UTC date == ET date at 23:20) -> go back to sleep
          python3 - <<'PY' || { echo "no shows today — exiting"; exit 0; }
          import json, datetime, sys
          try:
              up = json.load(open("docs/data/upcoming.json"))
          except Exception:
              sys.exit(1)
          now = datetime.datetime.utcnow()
          days = {now.strftime("%Y-%m-%d"), (now - datetime.timedelta(days=1)).strftime("%Y-%m-%d")}
          sys.exit(0 if any(e.get("date") in days for e in up) else 1)
          PY
          git config user.name "dci-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          publish() {
            git add -A data
            git diff --cached --quiet || git commit -m "Live scores: $(date -u '+%Y-%m-%d %H:%M UTC') (inputs)"
            git checkout -- . 2>/dev/null || true
            git clean -fd docs/data 2>/dev/null || true
            for i in 1 2 3 4; do
              if ! git pull --rebase -X theirs origin main; then
                git rebase --abort 2>/dev/null || true
                sleep $((5 * i)); continue
              fi
              python scraper/build_data.py
              git add -A data docs/data
              git diff --cached --quiet || git commit -m "Live scores: $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push && return 0
              sleep $((5 * i))
            done
            echo "::warning::live publish failed after retries"
            return 1
          }
          # poll through the Cadence relay: dci.org's Cloudflare challenges
          # runner IPs directly, and hashing a challenge page (whose nonce
          # rotates every request) made every poll look like "new scores"
          RELAY="https://cadenceapp.up.railway.app/fetch?url=https%3A%2F%2Fwww.dci.org%2Fscores"
          last=""
          end=$(( $(date +%s) + 300 * 60 ))   # five hours of watching
          while [ "$(date +%s)" -lt "$end" ]; do
            body=$(curl -sS --max-time 45 "$RELAY" || echo "")
            # only trust content that actually looks like the scores index
            if ! echo "$body" | grep -q "final-scores"; then
              echo "poll returned no scores index (relay/dci hiccup) — skipping"
              sleep 180; continue
            fi
            cur=$(echo "$body" | md5sum | cut -d" " -f1)
            if [ -n "$cur" ] && [ -n "$last" ] && [ "$cur" != "$last" ]; then
              echo "scores index changed — scraping"
              bash scraper/run_all.sh update || echo "::warning::scrape failed this cycle"
              publish || true
            fi
            [ -n "$cur" ] && last="$cur"
            sleep 180
          done
          echo "watch window closed"
