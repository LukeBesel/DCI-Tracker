name: Full historical backfill

on:
  workflow_dispatch:
    inputs:
      refresh_parse:
        description: "Re-parse cached pages (after parser changes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Scrape DCI.org (2013+)
        run: python scraper/scrape_dci.py
        working-directory: .
        env: { PYTHONPATH: scraper }
      - name: Scrape drum-corps.net archives (2001+)
        run: python scraper/scrape_dcnet.py ${{ inputs.refresh_parse && '--refresh' || '' }}
        env: { PYTHONPATH: scraper }
      - name: Scrape historical finals + DCA champions
        run: python scraper/scrape_history.py
        env: { PYTHONPATH: scraper }
      - name: Scrape DCA site
        run: python scraper/scrape_dca_site.py
        env: { PYTHONPATH: scraper }
      - name: Scrape news
        run: python scraper/scrape_news.py
        env: { PYTHONPATH: scraper }
      - name: Build site data
        run: python scraper/build_data.py
        env: { PYTHONPATH: scraper }
      - name: Commit results
        run: |
          git config user.name "dci-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Backfill: full historical scrape"
          git push
