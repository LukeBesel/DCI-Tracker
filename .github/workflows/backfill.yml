name: Full historical backfill

on:
  workflow_dispatch:
    inputs:
      refresh_parse:
        description: "Re-parse cached pages (after parser changes)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/backfill.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run full scrape
        run: bash scraper/run_all.sh backfill
        env:
          REFRESH: ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh_parse) && '1' || '' }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Backfill: full historical scrape"
          git pull --rebase origin main || true
          git push

  deploy:
    needs: backfill
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

