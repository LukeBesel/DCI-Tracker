name: Full historical backfill

on:
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Max live page fetches this run"
        default: "600"
  push:
    branches: [main]
    paths: [".github/workflows/backfill.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run backfill chunk
        run: bash scraper/run_all.sh backfill
        env:
          MAX_FETCHES: ${{ inputs.max_fetches || '600' }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Backfill chunk: $(date -u +'%F %H:%M') UTC"
          git pull --rebase origin main || true
          git push

  deploy:
    needs: backfill
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
