name: Pre-2013 history backfill

on:
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Max live page fetches this run"
        default: "2000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Run history chunk
        run: bash scraper/run_all.sh history
        env:
          MAX_FETCHES: ${{ inputs.max_fetches || '2000' }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "dci-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "History chunk: $(date -u +'%F %H:%M') UTC"
          # rebase onto whatever landed while we scraped; data conflicts
          # resolve in favor of this run (fresher scrape), retry the push
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((5 * i))
          done
          echo "::error::could not push results after retries"
          exit 1

  deploy:
    needs: history
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
