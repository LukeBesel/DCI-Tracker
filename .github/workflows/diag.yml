name: Fetch diagnostics
# One-shot, manual-only: confirm the fallback source is reachable from the
# GitHub runner network (different from dci.org, which Cloudflare-challenges
# these IPs). Read results from job logs.
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe fallback source
        run: |
          echo "=== downbeatdesigns.com from the runner ==="
          curl -sS -L --compressed --max-time 40 -D /tmp/h -o /tmp/b -w "status=%{http_code} size=%{size_download}\n" "https://downbeatdesigns.com/dci_2026" || echo "curl exit=$?"
          grep -iE "^(HTTP/|cf-mitigated|server):" /tmp/h | head -4 || true
          echo "shows on page: $(grep -c 'class=\"se-title\"' /tmp/b)"
          echo "Denton present: $(grep -c 'DCI Denton' /tmp/b)"
          echo "--- first score-event title:"
          grep -oE 'se-title">[^<]*' /tmp/b | head -1
